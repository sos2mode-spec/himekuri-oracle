// カード一覧
const cards = [

function nobi() {

const paw = document.getElementById("pawButton");

// ぷにゅっと縮む
paw.style.transform = "scale(0.9)";

setTimeout(function () {
    document.getElementById("startButton").style.display = "none";
}, 120);

// 今日の日付を作る
const today = new Date().toLocaleDateString();

// 保存されている日付
const savedDate = localStorage.getItem("oracleDate");

// 保存されているカード番号
let cardIndex = localStorage.getItem("oracleCard");

// 直近に出たカードの履歴
let oracleHistory = JSON.parse(
    localStorage.getItem("oracleHistory") || "[]"
);

// 日付が変わった、または初回なら新しく選ぶ
if (savedDate !== today || cardIndex === null) {

    // 直近2枚を除外
    const availableCards = cards
        .map((card, index) => index)
        .filter(index => !oracleHistory.includes(index));

    // 選べるカードの中からランダムに選ぶ
    const randomIndex = Math.floor(
        Math.random() * availableCards.length
    );

    cardIndex = availableCards[randomIndex];

    // 履歴に今日のカードを追加
    oracleHistory.push(Number(cardIndex));

    // 直近2枚だけ保存
    oracleHistory = oracleHistory.slice(-2);

    // 保存
    localStorage.setItem("oracleDate", today);
    localStorage.setItem("oracleCard", cardIndex);
    localStorage.setItem(
        "oracleHistory",
        JSON.stringify(oracleHistory)
    );
}

// 今日のカード
const selectedCard = cards[cardIndex];

    document.getElementById("dog").src = "dog_okiru.png";

    setTimeout(function () {

    const dog = document.getElementById("dog");

    dog.src = "dog_nobi.png";

    // のびだけ少し大きく
    dog.style.width = "130px";

}, 2000);


   

setTimeout(function () {

    const dog = document.getElementById("dog");
    const walk = document.getElementById("walk");

    // 元の大きさへ戻す
dog.style.width = "320px";

// 歩く画像に変更
dog.src = "dog_walk.png";

    walk.style.display = "block";
    walk.style.opacity = "1";

    // 犬は右側からスタート
let dogX = 10;

// とことこ文字は犬の少し左下
let walkX = -40;

let fade = 1;

dog.style.left = dogX + "px";

// とことこ文字だけゆっくり流す
walk.style.left = (walkX - fade * 80) + "px";

const timer = setInterval(function () {

    // 犬も文字も左へ同じ速度で動く
    dogX -= 1;
    walkX -= 1;

    dog.style.left = dogX + "px";
    walk.style.left = walkX + "px";

    // とことこはゆっくり消える
    fade -= 0.005;
    walk.style.opacity = fade;

    // 画面中央付近まで歩く
    if (dogX <= 170) {

        clearInterval(timer);

        // とことこは少し残してから消す
        setTimeout(function () {
            walk.style.display = "none";
        }, 2000);
               // 2秒後 ちょこん
        setTimeout(function () {
            dog.src = "dog_chokon.png";
        }, 2000);

        // 4秒後 めくる
        setTimeout(function () {
            dog.src = "dog_mekuru.png";
        }, 4000);

        // 6秒後 カード表示
        setTimeout(function () {

            // めくる犬を消す
            dog.style.display = "none";

            // 選ばれたカードを表示
            document.getElementById("card").src = selectedCard.image;

            document.getElementById("cardTitle").innerHTML = selectedCard.title;
            document.getElementById("flow").innerHTML = selectedCard.flow;
            document.getElementById("message").innerHTML =
                selectedCard.message.replace(/\n/g, "<br>");

            document.getElementById("today").innerHTML =
                "今日のカード<br>" + today;

            // カードとちょこんを表示
            document.getElementById("result").style.display = "block";

        }, 6000);

    }

}, 80); 

}, 6000);

}
